generation:
  default_engine: api  # api, idfc-coder, external-agent

idfc_coder:
  command: idfc-coder
  mode: interactive

llm:
  base_url: ${LLM_BASE_URL}
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}
  max_agent_turns: 15
  max_tool_calls: 25
  max_total_tool_chars: 100000

confluence:
  enabled: false
  base-url: ${CONFLUENCE_BASE_URL}
  parent-page-id: ${CONFLUENCE_PARENT_PAGE_ID}
  token: ${CONFLUENCE_TOKEN}
  timeout-seconds: 30
  preserve-manual-notes: true
